<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Hallownest Archives</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="library">
    <header class="site-header">
      <p class="eyebrow">FIELD NOTES FROM A FALLEN KINGDOM</p>
      <h1>The Hallownest Archives</h1>
      <p class="intro">A small collection of notes gathered beneath the surface.</p>
    </header>

    <section class="journal-shelf" aria-label="Journal library">
      <button class="journal journal-hunter" type="button" data-journal="hunter">
        <span class="book">
          <span class="cover">
            <span class="volume">VOL. 01</span>
            <span class="cover-title">Hunter's<br>Journal</span>
            <span class="cover-rule"></span>
            <span class="cover-mark">◇</span>
          </span>
        </span>
        <span class="journal-caption">Hunter's Journal</span>
      </button>

      <button class="journal journal-cartographer" type="button" data-journal="cartographer">
        <span class="book">
          <span class="cover">
            <span class="volume">VOL. 02</span>
            <span class="cover-title">Cartographer's<br>Notes</span>
            <span class="cover-rule"></span>
            <span class="cover-mark">◇</span>
          </span>
        </span>
        <span class="journal-caption">Cartographer's Notes</span>
      </button>

      <a href="charms.html" class="journal journal-charms" type="button" data-journal="charms">
        <span class="book">
          <span class="cover">
            <span class="volume">VOL. 03</span>
            <span class="cover-title">Charm<br>Compendium</span>
            <span class="cover-rule"></span>
            <span class="cover-mark">◇</span>
          </span>
        </span>
        <span class="journal-caption">Charm Compendium</span>
      </a>

      <button class="journal journal-traveller" type="button" data-journal="traveller">
        <span class="book">
          <span class="cover">
            <span class="volume">VOL. 04</span>
            <span class="cover-title">Traveller's<br>Log</span>
            <span class="cover-rule"></span>
            <span class="cover-mark">◇</span>
          </span>
        </span>
        <span class="journal-caption">Traveller's Log</span>
      </button>
    </section>

    <footer class="site-footer">
      <span>FOUR JOURNALS</span>
      <span class="footer-dot">·</span>
      <span>ONE KINGDOM TO EXPLORE</span>
    </footer>
  </main>

  <dialog class="notice" id="journal-notice">
    <button class="notice-close" type="button" aria-label="Close">×</button>
    <p class="eyebrow">JOURNAL SEALED</p>
    <h2 id="notice-title">Coming soon</h2>
    <p id="notice-copy">This journal is still being prepared.</p>
  </dialog>

  <script src="main.js"></script>
</body>
</html>
